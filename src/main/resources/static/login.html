<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 速购商城</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <h1>速购商城</h1>
        <p class="subtitle">性能测试系统</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>
        <p class="error-msg" id="errorMsg"></p>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var errEl = document.getElementById('errorMsg');

    errEl.style.color = '#e74c3c';
    if (!username || !password) {
        errEl.textContent = '请输入用户名和密码';
        errEl.style.display = 'block';
        return;
    }

    var ts = String(Date.now());
    // Client: MD5(plaintext + timestamp)
    var hashedPwd = md5(password + ts);

    var data = await apiPost('/user/login', {
        username: username,
        password: hashedPwd
    }, { 'ts': ts }, true);

    if (data.code === 200) {
        saveSession(data.data.token, username, data.data.role);
        errEl.textContent = '登录成功，正在跳转...';
        errEl.style.color = '#4caf50';
        errEl.style.display = 'block';
        setTimeout(function() {
            if (data.data.role === 1) {
                window.location.href = '/admin.html';
            } else {
                redirectToIndex();
            }
        }, 500);
    } else {
        errEl.textContent = data.msg || '登录失败';
        errEl.style.display = 'block';
    }
});
</script>
</body>
</html>

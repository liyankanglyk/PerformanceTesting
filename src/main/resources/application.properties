spring.application.name=PerformanceTesting

# Server
server.port=6060

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3380/performance_testing?useUnicode=true&characterEncoding=UTF-8
# ^ 显式指定连接字符集：中文 Windows 的默认字符集是 GBK，不写这两个参数时
#   一旦驱动版本/服务端配置变化就可能把中文写乱（初始化脚本已另在 DatabaseInitService 里强制 UTF-8）。
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# OpenAPI 3 文档（springdoc-openapi / Swagger UI）
# 旧入口 /doc.html 在 WebConfig 里重定向到 Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.xiaohua.performancetesting

# JWT
jwt.secret=xiaohua-performance-testing-secret-key-2026
jwt.expiration=3600000

# Operation log
# Whether user-side actions (USER_LOGIN, PLACE_ORDER) are written to operation_log.
# Turn it off for benchmark runs: order placement is the hot path and each order
# costs one extra INSERT when auditing is enabled. Chinese docs: see README.
operation-log.user-actions-enabled=true

# ==================== 数据库初始化（压测数据准备） ====================
# 启动时的行为：
#   always    每次重启都清库重建 + 灌初始数据（历史行为，演示/教学用，改完 DDL 直接重启即可）
#   if-absent 只在数据库或四张表缺失时才建，已有数据不动
#   never     启动完全不做初始化
db.init-mode=always

# 是否允许管理端手动“重新灌入测试数据”（POST /api/admin/db/reset）。
# 共享库或正式环境改成 false，接口会返回 403，避免被误触发清库。
db.reset.enabled=true
